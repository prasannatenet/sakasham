    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="assets/js/custom.js"></script>
    <script>
        (() => {
            const items = [...document.querySelectorAll(".gallery-item")];
            const lightbox = document.querySelector(".gallery-lightbox");
            const lightboxImage = lightbox.querySelector(".gallery-lightbox-image");
            const caption = lightbox.querySelector(".gallery-lightbox-caption");
            let activeIndex = 0;

            const showImage = index => {
                activeIndex = (index + items.length) % items.length;
                const image = items[activeIndex].querySelector("img");
                lightboxImage.src = image.currentSrc || image.src;
                lightboxImage.alt = image.alt;
                caption.textContent = `${activeIndex + 1} / ${items.length}`;
            };

            items.forEach((item, index) => item.addEventListener("click", () => {
                showImage(index);
                lightbox.showModal();
            }));

            lightbox.querySelector(".gallery-lightbox-close").addEventListener("click", () => lightbox.close());
            lightbox.querySelector(".gallery-lightbox-prev").addEventListener("click", () => showImage(activeIndex - 1));
            lightbox.querySelector(".gallery-lightbox-next").addEventListener("click", () => showImage(activeIndex + 1));
            lightbox.addEventListener("click", event => {
                if (event.target === lightbox) lightbox.close();
            });
            lightbox.addEventListener("keydown", event => {
                if (event.key === "ArrowLeft") showImage(activeIndex - 1);
                if (event.key === "ArrowRight") showImage(activeIndex + 1);
            });
        })();
    </script>
