<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="keywords" content="Packers and Movers">
    <meta name="description"
        content="Make your move hassle-free with Saksham Packers and Movers, offering secure packing, careful handling, and reliable home and office relocation services.">

    <!-- Material Icons -->
    
    <link rel="icon" type="image/png" href="assets/images/favs.png">

    <!-- Material Icons -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0..200">

    <!-- Font Awesome -->

<body class="packers-and-movers-in-cities">
    <div data-site-header></div>


    <section class="enquires-stepper">
        <div class="enquiry-wizard" data-enquiry-wizard>
            <nav class="enquiry-steps" aria-label="Move enquiry progress">
                <button class="enquiry-step is-complete" type="button" data-step-target="1" aria-label="Address, completed">
                    <span class="enquiry-step-number"><i class="fa-solid fa-check" aria-hidden="true"></i></span>
                    <span class="enquiry-step-label">Address</span>
                </button>
                <span class="enquiry-step-line" aria-hidden="true"></span>
                <button class="enquiry-step is-active" type="button" data-step-target="2" aria-current="step">
                    <span class="enquiry-step-number">2</span>
                    <span class="enquiry-step-label">Select Items</span>
                </button>
                <span class="enquiry-step-line" aria-hidden="true"></span>
                <button class="enquiry-step" type="button" data-step-target="3" disabled>
                    <span class="enquiry-step-number">3</span>
                    <span class="enquiry-step-label">Vehicle</span>
                </button>
                <span class="enquiry-step-line" aria-hidden="true"></span>
                <button class="enquiry-step" type="button" data-step-target="4" disabled>
                    <span class="enquiry-step-number">4</span>
                    <span class="enquiry-step-label">Information</span>
                </button>
            </nav>

            <div class="enquiry-heading">
                <p class="enquiry-kicker">YOUR MOVE, MADE SIMPLE</p>
                <h2 data-step-title>Select items for your move</h2>
                <p data-step-description>Choose the items you’re moving. You can select multiple items and adjust quantities before continuing.</p>
            </div>

            <div class="enquiry-address-summary" data-address-summary aria-live="polite"></div>
            <div class="enquiry-panel" data-step-panel></div>
            <div class="enquiry-feedback" data-enquiry-feedback role="status" aria-live="polite"></div>
        </div>
    </section>



    <!--  FOOTER ======= -->
    <div data-site-footer></div>


    <!-- Choose Your city Modal -->
    <div class="site-modal chooseCityModal" id="chooseCityModal" aria-hidden="true">
        <div class="site-modal-overlay" data-modal-close></div>
        <div class="site-modal-dialog">
            <button type="button" class="site-modal-close" data-modal-close>
                <span class="material-symbols-outlined">close</span>
            </button>

            <div class="site-modal-content">

                <h2 class="text-center mt-0">Choose Your city</h2>

                <div class="cityWrap">
                    <div class="cityBox">
                        <a href="">
                            <div class="cityImage">
                                <img src="../assets/images/jaipur-img.webp" alt="">
                            </div>
                            <h5>Jaipur</h5>
                        </a>
                    </div>
                    <div class="cityBox">
                        <a href="">
                            <div class="cityImage">
                                <img src="../assets/images/udaipur-img.webp" alt="">
                            </div>
                            <h5>Udaipur</h5>
                        </a>
                    </div>
                    <div class="cityBox">
                        <a href="">
                            <div class="cityImage">
                                <img src="../assets/images/kota-img.webp" alt="">
                            </div>
                            <h5>Kota</h5>
                        </a>
                    </div>
                    <div class="cityBox">
                        <a href="">
                            <div class="cityImage">
                                <img src="../assets/images/bikaner-img.webp" alt="">
                            </div>
                            <h5>Bikaner</h5>
                        </a>
                    </div>
                    <div class="cityBox">
                        <a href="">
                            <div class="cityImage">
                                <img src="../assets/images/nashik-img.webp" alt="">
                            </div>
                            <h5>Nashik</h5>
                        </a>
                    </div>
                    <div class="cityBox">
                        <a href="">
                            <div class="cityImage">
                                <img src="../assets/images/pune-img.webp" alt="">
                            </div>
                            <h5>Pune</h5>
                        </a>
                    </div>
                    <div class="cityBox">
                        <a href="">
                            <div class="cityImage">
                                <img src="../assets/images/mumbai-img.webp" alt="">
                            </div>
                            <h5>Mumbai</h5>
                        </a>
                    </div>
                    <div class="cityBox">
                        <a href="">
                            <div class="cityImage">
                                <img src="../assets/images/lonavla-img.webp" alt="">
                            </div>
                            <h5>Lonavla</h5>
                        </a>
                    </div>
                    <div class="cityBox">
                        <a href="">
                            <div class="cityImage">
                                <img src="../assets/images/gurugram.webp" alt="">
                            </div>
                            <h5>Gurugram</h5>
                        </a>
                    </div>
                    <div class="cityBox">
                        <a href="">
                            <div class="cityImage">
                                <img src="../assets/images/delhi-img.webp" alt="">
                            </div>
                            <h5>Delhi</h5>

                </div>
            </div>
        </div>
